services:
  caddy:
    image: caddy:2-alpine
    container_name: chds_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - chds_network

  db:
    image: postgres:15-alpine
    container_name: chds_db
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${DB_NAME:-chds_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_super_secret_db_password}
      POSTGRES_ENCRYPTION_KEY: ${POSTGRES_ENCRYPTION_KEY:-your-aes-256-encryption-key-here}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chds_network

  redis:
    image: redis:7-alpine
    container_name: chds_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chds_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chds_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/usr/src/app/uploads
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-chds_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_super_secret_db_password}
      APP_USER: app_user
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-change_me_app_user_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-min-32-chars-here}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key-min-32-chars}
      SESSION_SECRET: ${SESSION_SECRET:-super-secret-session-key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-CHDS <noreply@chds.np>}
      FRONTEND_URL: https://localhost
      DISABLE_RATE_LIMIT: ${DISABLE_RATE_LIMIT:-true}
      FHIR_BASE: ${FHIR_BASE:-http://fhir:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      FAILED_LOGIN_TTL: ${FAILED_LOGIN_TTL:-3600}
      BREACH_THRESHOLD: ${BREACH_THRESHOLD:-7}
      UPLOAD_DIR: ${UPLOAD_DIR:-/usr/src/app/uploads}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/etc/ssl/certs/server.key}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/etc/ssl/certs/server.crt}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health',r=>{process.exit(r.statusCode==200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - chds_network

  mailpit:
    image: axllent/mailpit
    container_name: chds_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - chds_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chds_frontend
    restart: unless-stopped
    command: npx next start -p 3000
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_started
    networks:
      - chds_network

  fhir:
    image: hapiproject/hapi:latest
    container_name: chds_fhir
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.server_address: "http://localhost:8080/fhir"
      hapi.fhir.subscription.resthook_enabled: "true"
      hapi.fhir.enable_repository_validating_interceptor: "false"
    networks:
      - chds_network

  backup:
    image: postgres:15-alpine
    container_name: chds_backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-entrypoint.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-chds_db}
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:-change_me_super_secret_db_password}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
    volumes:
      - ./scripts/backup-entrypoint.sh:/scripts/backup-entrypoint.sh:ro
      - db_backup:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chds_network

volumes:
  postgres_data:
    name: chds_postgres_data
    driver: local
  redis_data:
    name: chds_redis_data
    driver: local
  caddy_data:
    name: chds_caddy_data
    driver: local
  caddy_config:
    name: chds_caddy_config
    driver: local
  uploads_data:
    name: chds_uploads_data
    driver: local
  db_backup:
    name: chds_db_backup
    driver: local

networks:
  chds_network:
    name: chds_network
    driver: bridge
