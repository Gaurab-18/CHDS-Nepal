name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: Backend Type-Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: chds_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: psql -h localhost -U postgres -d chds_db -f ../db/init.sql
        env:
          PGPASSWORD: test_password
      - run: psql -h localhost -U postgres -d chds_db -f ../db/migration.sql
        env:
          PGPASSWORD: test_password
      - run: psql -h localhost -U postgres -d chds_db -f ../db/ci-seed-test-users.sql
        env:
          PGPASSWORD: test_password
      - run: npx tsc
      - name: Start server and run tests
        run: |
          npx ts-node src/index.ts &
          SERVER_PID=$!
          # Wait for server to be ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 2
          done
          npx jest --verbose 2>&1 || true
          kill $SERVER_PID 2>/dev/null || true
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: chds_db
          DB_USER: postgres
          APP_USER: postgres
          APP_USER_PASSWORD: test_password
          ENCRYPTION_KEY: test-encryption-key-at-least-32-chars!!
          JWT_SECRET: test-jwt-secret-at-least-32-chars!!
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx jest --passWithNoTests
